<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gather — Event Discovery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <div class="brand"><span class="mark">✳</span> gather</div>

      <nav class="navlinks">
        <a href="#events">Discover</a>
        <a href="#events">Categories</a>
        <a href="#about">About</a>
      </nav>

      <div class="avatar">S</div>
    </header>

    <main>
      <section class="hero">
        <div>
          <div class="eyebrow">Good things happen together</div>
          <h1>Find your next <span>moment.</span></h1>
          <p>Discover the best experiences happening around you.</p>
        </div>

        <div class="searchbox">
          <span class="searchicon">⌕</span>
          <input id="search" type="search" placeholder="Search events, places...">
          <button id="searchBtn">Explore</button>
        </div>
      </section>

      <div class="controls">
        <div class="pills" id="filters">
          <button class="pill active" data-category="All">For you</button>
          <button class="pill" data-category="Music">♫ Music</button>
          <button class="pill" data-category="Food">♨ Food</button>
          <button class="pill" data-category="Arts">✳ Arts</button>
          <button class="pill" data-category="Outdoors">↗ Outdoors</button>
        </div>

        <button class="date" id="dateFilter">◷ &nbsp; Any date ⌄</button>
      </div>

      <section id="events">
        <div class="sectionhead">
          <h2>Popular near you</h2>
          <span id="count">0 events</span>
        </div>

        <div class="grid" id="grid"></div>
      </section>
    </main>

    <footer class="footer" id="about">
      <span>© 2025 Gather. Find your people.</span>
      <span>Made for the moments that matter ✳</span>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
